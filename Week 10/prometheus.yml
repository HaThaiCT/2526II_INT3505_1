# Prometheus Configuration Example
# File: prometheus.yml
# Place this file in your Prometheus directory and start Prometheus

global:
  scrape_interval: 15s      # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'library-api-monitor'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them (optional)
rule_files:
  # - "alert_rules.yml"
  # - "recording_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Library API
  - job_name: 'library_api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:5000']
    scrape_interval: 5s
    scrape_timeout: 5s

# Optional: Remote storage configuration
# remote_write:
#   - url: "http://localhost:8086/api/v1/push?db=prometheus"
